# compose.yaml
# Runs the local SignalWatch infrastructure required for Sprint S0.
# Kafka runs as a single-node KRaft cluster; kafka-init creates the
# smoke-test topic after the broker becomes healthy.

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    container_name: signalwatch-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      # Single-node KRaft configuration: this broker is also the controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 29092 is used by containers.
      # 9092 is used by applications running on the Mac.
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single-node development settings.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Make consumer-group testing faster locally.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created explicitly rather than accidentally.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    volumes:
      - kafka_data:/var/lib/kafka/data

  # Creates local Kafka topics after the broker becomes healthy.
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.1}
    container_name: signalwatch-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_TEST_TOPIC: ${KAFKA_TEST_TOPIC:-signalwatch.s0.smoke}
      KAFKA_BLUESKY_TOPIC: ${KAFKA_BLUESKY_TOPIC:-signalwatch.bluesky.posts.v1}

    command:
      - /bin/bash
      - -ec
      - |
        for topic in "$${KAFKA_TEST_TOPIC}" "$${KAFKA_BLUESKY_TOPIC}"; do
          echo "Ensuring Kafka topic exists: $$topic"

          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1
        done

        echo "Kafka topics:"
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list

volumes:
  kafka_data: